  <h1>Contact</h1>

  <p>
    Email: <a href="mailto:ndewan@ucsd.edu">ndewan@ucsd.edu</a><br>

  <!-- Updated form with clean JS-based mailto handling -->
  <form id="contact-form">
    <!-- Subject Field -->
    <label for="subject">Subject:</label>
    <input id="subject" name="subject" type="text" placeholder="What's this about?" required />

    <!-- Message Field -->
    <label for="body">Message:</label>
    <textarea id="body" name="body" placeholder="Your message" required></textarea>

    <!-- Submit Button -->
    <button type="submit">Send Email</button>
  </form>
